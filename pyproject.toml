[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "femto-editor"
version = "0.0.3"
description = "Femto - a tiny nano-style terminal text editor in pure Python"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Femto Contributors" }]
keywords = ["editor", "terminal", "curses", "nano", "text-editor", "tui"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Console :: Curses",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Topic :: Text Editors :: Text Processing",
]
# Pure Python everywhere; Windows needs the curses back-port.
dependencies = [
	"windows-curses; sys_platform == 'win32'",
]

[project.scripts]
femto = "femto.__main__:main"

[project.urls]
Homepage = "https://github.com/codewithzaqar/femto"

[tool.setuptools]
packages = ["femto"]

[tool.setuptools.package-data]
femto = ["themes/*.ini"]
